<body>
<canvas id="game"></canvas>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2, PI = Math.PI;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const g1c = document.createElement('canvas'), g1 = g1c.getContext('2d');
const g2c = document.createElement('canvas'), g2 = g2c.getContext('2d');
const wpc = document.createElement('canvas'), wp = wpc.getContext('2d');    // scratch copy for the hit shockwave

// ---------- palette: signal green, warning orange-red, black plate ----------
const G = b => `rgb(${30 * b | 0},${255 * b | 0},${150 * b | 0})`;
const O = b => `rgb(${255 * b | 0},${74 * b | 0},${10 * b | 0})`;
const A = b => `rgb(${255 * b | 0},${150 * b | 0},0)`;                 // amber: hanging signs
const WH = b => `rgb(${255 * b | 0},${255 * b | 0},${255 * b | 0})`;   // lunar white: the walker
function heatCol(h, b) {   // green -> amber -> red
  const m = (x, y, k) => (x + (y - x) * k) * b | 0;
  return h < 0.5 ? `rgb(${m(30, 255, h * 2)},${m(255, 172, h * 2)},${m(150, 0, h * 2)})`
                 : `rgb(${255 * b | 0},${m(172, 36, h * 2 - 1)},${m(0, 8, h * 2 - 1)})`;
}

// ---------- layout / projection ----------
let W, H, DPR, R, U, cx, py, pitch, rise, Rin, rp, Rc, base, yw, aMin, aMax;
let p, dots;                        // LED pitch (css px) and the dot-matrix pattern
const K = 0.3;                      // camera tilt (ellipse squash)
const SEG = PI / 20;                // track panel size
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g1c.width = Math.ceil(cv.width / 4); g1c.height = Math.ceil(cv.height / 4);
  g2c.width = Math.ceil(cv.width / 14); g2c.height = Math.ceil(cv.height / 14);
  wpc.width = cv.width; wpc.height = cv.height;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  R = Math.min(W * 0.42, H * 0.24); U = R * 1.45;
  cx = W / 2; py = H * 0.62;
  pitch = R * 1.3; rise = pitch / TAU;
  Rin = R * 0.56; rp = R * 0.8; Rc = Rin * 0.94;
  base = py - rp * K;
  yw = Math.min(py + R * 1.2, H * 0.93);
  aMin = -(yw - base + R * 0.9) / rise;
  aMax = (base + R * 0.6) / rise;
  // LED matrix: whole device pixels per dot so the array stays perfectly regular
  const pd = Math.max(4, Math.round(Math.min(6, Math.max(3.6, R / 38)) * DPR));
  p = pd / DPR;
  const d = document.createElement('canvas'); d.width = d.height = pd;
  const dc = d.getContext('2d'), gr = dc.createRadialGradient(pd / 2, pd / 2, 0, pd / 2, pd / 2, pd / 2);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.62, 'rgba(0,0,0,1)'); gr.addColorStop(0.9, 'rgba(0,0,0,0)');
  dc.fillStyle = gr; dc.fillRect(0, 0, pd, pd);
  dots = ctx.createPattern(d, 'repeat');
}
// a = angle ahead of the player (0 = front, facing camera), r = radius, h = height above track (px)
function P(a, r, h) { return [cx + Math.sin(a) * r, base - a * rise - h + Math.cos(a) * r * K]; }
window.addEventListener('resize', resize); resize();

// ---------- 5x7 dot-matrix font ----------
const FONT = {};
(() => {
  const src = {
    '0': '01110,10001,10011,10101,11001,10001,01110', '1': '00100,01100,00100,00100,00100,00100,01110',
    '2': '01110,10001,00001,00010,00100,01000,11111', '3': '11111,00010,00100,00010,00001,10001,01110',
    '4': '00010,00110,01010,10010,11111,00010,00010', '5': '11111,10000,11110,00001,00001,10001,01110',
    '6': '00110,01000,10000,11110,10001,10001,01110', '7': '11111,00001,00010,00100,01000,01000,01000',
    '8': '01110,10001,10001,01110,10001,10001,01110', '9': '01110,10001,10001,01111,00001,00010,01100',
    A: '01110,10001,10001,11111,10001,10001,10001', B: '11110,10001,10001,11110,10001,10001,11110',
    C: '01110,10001,10000,10000,10000,10001,01110', D: '11110,10001,10001,10001,10001,10001,11110',
    E: '11111,10000,10000,11110,10000,10000,11111', F: '11111,10000,10000,11110,10000,10000,10000',
    G: '01110,10001,10000,10111,10001,10001,01111', H: '10001,10001,10001,11111,10001,10001,10001',
    I: '01110,00100,00100,00100,00100,00100,01110', J: '00111,00010,00010,00010,00010,10010,01100',
    K: '10001,10010,10100,11000,10100,10010,10001', L: '10000,10000,10000,10000,10000,10000,11111',
    M: '10001,11011,10101,10101,10001,10001,10001', N: '10001,11001,10101,10011,10001,10001,10001',
    O: '01110,10001,10001,10001,10001,10001,01110', P: '11110,10001,10001,11110,10000,10000,10000',
    Q: '01110,10001,10001,10001,10101,10010,01101', R: '11110,10001,10001,11110,10100,10010,10001',
    S: '01111,10000,10000,01110,00001,00001,11110', T: '11111,00100,00100,00100,00100,00100,00100',
    U: '10001,10001,10001,10001,10001,10001,01110', V: '10001,10001,10001,10001,10001,01010,00100',
    W: '10001,10001,10001,10101,10101,11011,10001', X: '10001,10001,01010,00100,01010,10001,10001',
    Y: '10001,10001,01010,00100,00100,00100,00100', Z: '11111,00001,00010,00100,01000,10000,11111',
    '.': '00000,00000,00000,00000,00000,01100,01100', ':': '00000,01100,01100,00000,01100,01100,00000',
    '=': '00000,00000,11111,00000,11111,00000,00000', '-': '00000,00000,00000,11111,00000,00000,00000',
    "'": '00100,00100,01000,00000,00000,00000,00000', '/': '00001,00010,00010,00100,01000,01000,10000', '!': '00100,00100,00100,00100,00100,00000,00100',
    ' ': '00000,00000,00000,00000,00000,00000,00000',
  };
  for (const k in src) FONT[k] = src[k].split(',');
})();
const ICON = {
  sound: ['...#..#..', '..##...#.', '####.#.#.', '####.#.#.', '####.#.#.', '..##...#.', '...#..#..'],
  muted: ['...#.....', '..##.....', '####.#.#.', '####..#..', '####.#.#.', '..##.....', '...#.....'],
  skip:  ['#...#...#', '##..##..#', '###.###.#', '###.###.#', '###.###.#', '##..##..#', '#...#...#'],
};
function icon(rows, x, y, col) {
  const c0 = Math.round(x / p), r0 = Math.round(y / p);
  ctx.fillStyle = col;
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < rows[r].length; c++)
    if (rows[r][c] === '#') ctx.fillRect((c0 + c) * p, (r0 + r) * p, p + 0.5, p + 0.5);
}
function textW(str, s) { return (str.length * 6 - 1) * s; }
// x,y in css px (snapped to the LED grid); s = dots per font pixel
function text(str, x, y, s, col, align) {
  const w = textW(str, s);
  let c0 = Math.round(x / p - (align === 'left' ? 0 : align === 'right' ? w : w / 2));
  const r0 = Math.round(y / p);
  ctx.fillStyle = col;
  for (const ch of str) {
    const gph = FONT[ch] || FONT[' '];
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++)
      if (gph[r][c] === '1') ctx.fillRect((c0 + c * s) * p, (r0 + r * s) * p, s * p + 0.5, s * p + 0.5);
    c0 += 6 * s;
  }
}

// ---------- state ----------
const JUMP_H = 0.46, JUMP_T = 0.56, DUCK_T = 0.5;   // R units / seconds
const GRAV = 8 * JUMP_H / (JUMP_T * JUMP_T), JUMP_V = 4 * JUMP_H / JUMP_T;
const LOW_H = 0.19, BEAM_LO = 0.39, BEAM_HI = 0.6, HITW = 0.09;
let state = 'loading', loadDone = false, dist = 0, speed = 1.4, t = 0, lives = 3, cleared = 0, inv = 0, shake = 0, flash = 0, overT = 0, newBest = false;
let obstacles = [], nextS = 0, lastType = '', sameRun = 0, parts = [];
let jy = 0, vy = 0, air = false, jumpBuf = 0, duckBuf = 0, duckT = 0, duckCd = 0, slam = false;
let fall = null, best = 0, hintOn = false, muted = false;
let sea = 0, seaT = 0, runPh = 0, pulse = 0, bars = [], waveProg = 0, ctrl = 'tb', ctrlRect = null;
try { if (localStorage.getItem('neonhelix.ctrl') === 'lr') ctrl = 'lr'; } catch (e) {}
function seaLevel() { return yw - sea; }
const WARP_T = 0.55;
let rips = [], warp = 0;
function splash(x, amp) { rips.push({ x, age: 0, amp }); if (rips.length > 10) rips.shift(); }
// surface displacement at x from every active splash: a wave packet running outward both ways
function seaRip(x, k) {
  let d = 0;
  for (const r of rips) {
    const q = (Math.abs(x - r.x) - r.age * R * 2.4) / (R * 0.42);
    if (q > 2.6 || q < -2.6) continue;
    d -= r.amp * Math.exp(-r.age * 1.1) * Math.exp(-q * q) * Math.cos(q * 3.2);
  }
  return d / (1 + k * 0.3);
}
const speedAt = tt => 1.9 + 3.5 * (1 - Math.exp(-tt / 40));
try { best = parseFloat(localStorage.getItem('neonhelix.best')) || 0; } catch (e) {}

function ducking() { return !air && duckT > 0; }
function startDuck() { duckT = DUCK_T; duckCd = DUCK_T + 0.12; sfx.duck(); }

function start() {
  state = 'play'; t = 0; speed = speedAt(0); lives = 3; cleared = 0; inv = 0; shake = 0; flash = 0;
  obstacles = []; parts = []; rips = []; warp = 0; nextS = dist + 8; lastType = ''; sameRun = 0;
  jy = 0; vy = 0; air = false; jumpBuf = 0; duckBuf = 0; duckT = 0; duckCd = 0; slam = false; fall = null; hintOn = true; seaT = 0;
  sfx.start();
}

function spawn() {
  while (nextS < dist + aMax + 1) {
    const ta = t + Math.max(0, nextS - dist) / speed, sp = speedAt(ta);   // when (and how fast) it will reach the runner
    let type = Math.random() < 0.5 ? 'low' : 'high';
    if (type === lastType && sameRun >= 2) type = type === 'low' ? 'high' : 'low';
    sameRun = type === lastType ? sameRun + 1 : 1; lastType = type;
    obstacles.push({ s: nextS, type, done: false });
    const tg = Math.max(0.6, 1.35 - ta * 0.016) + Math.random() * Math.max(0.2, 0.85 - ta * 0.014);
    nextS += sp * tg;
  }
}

// sparks: single LEDs flying off; col 'g' or 'o'
function burst(x, y, col, n, pow) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = (0.25 + Math.random()) * pow, life = 0.3 + Math.random() * 0.6;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.8, life, max: life, col });
  }
}

function hit(o) {
  o.done = true; o.dead = true;
  lives--; inv = 1.0; shake = 0.4; flash = 0.35; warp = WARP_T; splash(cx, p * 5);
  burst(cx, py - R * 0.25, 'o', 60, R * 3.2);
  sfx.hit();
  if (lives <= 0) {
    state = 'dying';
    fall = { x: 0, y: -jy * R, vx: -R * 1.5, vy: -R * 2.4, rot: 0 };
  }
}

function updateWave(dt) {
  const n = Math.ceil(W / (p * 3) / 2) + 1;
  if (bars.length !== n) bars = new Array(n).fill(0);
  const prog = state === 'menu' ? 0 : Math.min(1, t / 75), live = sfx.spectrum(), tm = performance.now() * 0.001;
  if (live) { const e = (live[0] + live[1] + live[2]) / 765; if (e * e > pulse) pulse = e * e; }
  for (let i = 0; i < n; i++) {
    const f = i / n;
    let v = pulse * Math.exp(-f * 2.4) * 0.55;
    if (live) v = Math.max(v, live[Math.floor(Math.pow(f, 1.4) * 44)] / 255);
    v = v * (0.3 + 1.2 * prog)
      + (0.05 + 0.34 * prog) * (0.5 + 0.5 * Math.sin(tm * (3 + prog * 10) + i * 0.9 + Math.sin(tm * 1.7 + i * 0.31) * (1 + prog * 3))) * (0.45 + 0.7 * pulse + 0.5 * prog);
    if (prog > 0.5) v += (Math.random() - 0.5) * (prog - 0.5) * 0.5;
    v = Math.max(0, Math.min(1, v));
    bars[i] += (v - bars[i]) * (v > bars[i] ? 0.65 : Math.min(1, dt * (5 + prog * 8)));
  }
  waveProg = prog;
}

function update(dt) {
  if (state === 'loading' && loadDone && performance.now() > 900) state = 'menu';
  pulse = Math.max(0, pulse - dt * 5);
  runPh += dt * (7 + speed * 2.4);
  if (state === 'menu') seaT = 0;
  sea += (seaT * (yw - (py + R * 0.34)) - sea) * Math.min(1, dt * 1.5);
  updateWave(dt);
  if (state === 'menu') { dist += dt * 0.7; }
  else if (state === 'over') { dist += dt * 0.5; overT += dt; }
  else if (state === 'dying') {
    speed *= Math.pow(0.2, dt); dist += speed * dt;
    fall.vy += R * 9 * dt; fall.x += fall.vx * dt; fall.y += fall.vy * dt; fall.rot -= dt * 9;
    if (py + fall.y > seaLevel() + R * 0.05) {
      burst(cx + fall.x, seaLevel(), 'o', 90, R * 4); splash(cx + fall.x, p * 11); shake = 0.3; sfx.splash(); sfx.gameOver();
      state = 'over'; overT = 0;
      newBest = t > best;
      if (newBest) { best = t; try { localStorage.setItem('neonhelix.best', String(best)); } catch (e) {} }
    }
  } else if (state === 'play') {
    t += dt;
    speed = speedAt(t);
    seaT = Math.min(1, t / 70);                       // the sea creeps up toward the runner
    if (hintOn && obstacles.some(o => o.s - dist < 2.9)) hintOn = false;
    dist += speed * dt;
    spawn();
    // jump / duck
    jumpBuf -= dt; duckBuf -= dt; duckT -= dt; duckCd -= dt;
    if (air && duckBuf > 0) { slam = true; duckBuf = 0; }
    if (air) {
      vy -= GRAV * (slam ? 3.2 : 1) * dt; jy += vy * dt;
      if (jy <= 0) {
        jy = 0; vy = 0; air = false; burst(cx, py, 'g', 6, R * 1.1);
        if (slam) { slam = false; startDuck(); }
      }
    }
    if (!air && duckBuf > 0 && duckCd <= 0) { duckBuf = 0; startDuck(); }
    if (!air && jumpBuf > 0) { air = true; vy = JUMP_V; jumpBuf = 0; duckT = 0; burst(cx, py, 'g', 6, R * 1.1); sfx.jump(); }
    // collisions
    for (const o of obstacles) {
      if (o.done) continue;
      const a = o.s - dist;
      if (a < -HITW) {
        o.done = true; cleared++; sfx.pass();
        const q = P(a, rp, (o.type === 'low' ? LOW_H : BEAM_HI) * R);
        burst(q[0], q[1], 'g', 8, R * 1.3);
        continue;
      }
      if (a < HITW && inv <= 0) {
        if (o.type === 'low' ? jy < LOW_H - 0.02 : !ducking()) hit(o);
      }
    }
    for (const o of obstacles) {          // obstacles riding the ramp down plunge into the sea
      if (o.wet) continue;
      const q = P(o.s - dist, rp, 0);
      if (q[1] > seaLevel()) {
        o.wet = true;
        if (q[0] > -20 && q[0] < W + 20) { splash(q[0], p * 1.6); burst(q[0], seaLevel(), 'o', 4, R * 0.9); }
      }
    }
    obstacles = obstacles.filter(o => !o.dead && o.s - dist > aMin);
    inv -= dt;
    if (ducking() && Math.random() < 0.7) parts.push({ x: cx - U * 0.03, y: py, vx: -R * (0.8 + Math.random() * 1.4), vy: -R * 0.6 * Math.random(), life: 0.3, max: 0.3, col: 'g' });
    if (sfx.beat(dt, speed)) pulse = 1;
  }
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt); warp = Math.max(0, warp - dt);
  for (const r of rips) r.age += dt;
  rips = rips.filter(r => r.age < 3.5);
  const drag = Math.pow(0.12, dt);
  for (const q of parts) { q.life -= dt; q.vx *= drag; q.vy = q.vy * drag + R * 1.8 * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  parts = parts.filter(q => q.life > 0);
  if (parts.length > 400) parts.splice(0, parts.length - 400);
}

// ---------- drawing: everything below paints the light that the plate's cut-outs reveal ----------
function quad(p0, p1, p2, p3) {
  ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.lineTo(p2[0], p2[1]); ctx.lineTo(p3[0], p3[1]); ctx.closePath();
}
function line(p0, p1) { ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke(); }

function drawSeg(i, back) {
  const a0 = i * SEG - dist, a1 = a0 + SEG + 0.004, c = Math.cos(a0 + SEG / 2);
  const sh = back ? 0.3 + 0.12 * (1 + c) : 0.55 + 0.45 * c;
  const i0 = P(a0, Rin, 0), o0 = P(a0, R, 0), o1 = P(a1, R, 0), i1 = P(a1, Rin, 0);
  if (Math.min(i0[1], i1[1], o0[1], o1[1]) > H + 10 || Math.max(i0[1], i1[1], o0[1], o1[1]) < -10) return;
  if (!back) {      // unlit rim keeps each turn of the ramp separate from what's behind it
    const th = R * 0.09, b0 = P(a0, R, -th), b1 = P(a1, R, -th);
    quad(o0, o1, b1, b0); ctx.fillStyle = '#000'; ctx.fill();
  }
  quad(i0, o0, o1, i1);
  ctx.fillStyle = G(((Math.floor(i / 3) & 1) ? 0.36 : 0.17) * sh); ctx.fill();
  ctx.lineWidth = p * (back ? 1 : 1.5);
  ctx.strokeStyle = G((back ? 0.5 : 0.95) * sh); line(o0, o1);
}

function drawColumn() {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(cx - Rc, 0, Rc * 2, H);
  ctx.strokeStyle = G(0.22); ctx.lineWidth = p;
  ctx.beginPath(); ctx.moveTo(cx - Rc, 0); ctx.lineTo(cx - Rc, H); ctx.moveTo(cx + Rc, 0); ctx.lineTo(cx + Rc, H); ctx.stroke();
}

function drawObstacle(o, a, back, now) {
  const w = 0.05, low = o.type === 'low';
  const h0 = (low ? 0 : BEAM_LO) * R, h1 = (low ? LOW_H : BEAM_HI) * R;
  const ra = Rin + R * 0.07, rb = R - R * 0.07, top = pitch - R * 0.09;
  ctx.save();
  ctx.globalAlpha = 0.32 + 0.68 * Math.max(0, Math.min(1, (Math.cos(a) + 0.3) / 0.5)); ctx.lineJoin = 'round';
  const aL = a - w, aR = a + w;
  const faces = [
    [P(aR, Rin, h0), P(aR, R, h0), P(aR, R, h1), P(aR, Rin, h1), 0.8],
    [P(aL, Rin, h1), P(aL, R, h1), P(aR, R, h1), P(aR, Rin, h1), 1],
    [P(aL, R, h0), P(aR, R, h0), P(aR, R, h1), P(aL, R, h1), 0.62],
    [P(aL, Rin, h0), P(aL, R, h0), P(aL, R, h1), P(aL, Rin, h1), 0.8],
  ];
  if (!back) {      // dark surround so the symbol reads as its own aperture
    ctx.strokeStyle = '#000'; ctx.lineWidth = p * 2.6;
    for (const f of faces) { quad(f[0], f[1], f[2], f[3]); ctx.stroke(); }
    if (!low) { ctx.lineWidth = p * 3; line(P(a, ra, h1), P(a, ra, top)); line(P(a, rb, h1), P(a, rb, top)); }
  }
  if (!low) {       // rods up to the underside of the ramp above: the sign hangs from the ceiling
    ctx.lineWidth = p * 1.2; ctx.strokeStyle = A(0.9);
    line(P(a, ra, h1), P(a, ra, top)); line(P(a, rb, h1), P(a, rb, top));
  }
  const ga = ctx.globalAlpha;
  ctx.globalAlpha = 1; ctx.fillStyle = '#000';
  for (const f of faces) { quad(f[0], f[1], f[2], f[3]); ctx.fill(); }

// loading screen: a plain spiral turning on the black plate
function drawLoader(now) {
  const rMax = Math.min(W, H) * 0.15, turns = 2.6, rot = now * 0.005;
  ctx.strokeStyle = G(1); ctx.lineWidth = p * 1.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

// hit shockwave: a band of sideways distortion bursts out from the runner, up and down the whole level.

  wp.drawImage(cv, 0, 0);

function draw(now) {
  // 1. the lamp layer: flat coloured light, drawn as if the whole plate were transparent
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * shake * 8) * p, Math.round((Math.random() - 0.5) * shake * 8) * p);

const TRACKS = [

  { name: 'FEEL GOOD INC', file: 'feel-good-inc' },
  { name: 'RUTHERGLEN HEIGHTS', file: 'rutherglen-heights' },

    if (!AC || muted) return;
    if (AC.state !== 'running') { wake(); return; }
    try {
      const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
      o.type = type; o.frequency.setValueAtTime(f0, n); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), n + dur);
      g.gain.setValueAtTime(vol, n); g.gain.exponentialRampToValueAtTime(0.0001, n + dur);
      o.connect(g); g.connect(sfxBus); o.start(n); o.stop(n + dur + 0.02);
      o.onended = () => { try { o.disconnect(); g.disconnect(); } catch (e) {} };   // free finished voices
    } catch (e) {}
  }
  return {
    init, wake,
    spectrum() { if (!AC || !an || AC.state !== 'running') return null; an.getByteFrequencyData(fb); return fb; },
    toggle() { muted = !muted; if (out) out.gain.value = muted ? 0 : 1; },
    // a new round: the first one starts a random track
    start() {
      acc = 0; step = 0;
      if (!AC) return;
      if (play) { setMix('main', 0.6); return; }      // same track carries on; bring the main mix back
      if (queued < 0) queued = Math.floor(Math.random() * TRACKS.length);
      startMusic(queued);
    },
    // round over: stay on the hit mix until the next game starts
    gameOver() { setMix('hit', 0.05); },
    skip() {
      if (!AC) return;
      const next = ((queued < 0 ? 0 : queued) + 1) % TRACKS.length;
      if (state === 'play' || play) startMusic(next, state !== 'play');   // between games the new track comes in on its hit mix
      else { queued = next; loadTrack(next); trackName = TRACKS[next].name; trackShown = performance.now(); }
    },
    jump() { tone(330, 720, 0.14, 'square', 0.08); },
    duck() { tone(300, 140, 0.1, 'square', 0.07); },
    pass() { tone(1320, 1760, 0.06, 'sine', 0.07); },
    // drop to the "hit" mix, then ease the main mix back in over it
    hit() {
      if (!AC) return;
      const n = AC.currentTime;
      if (!play) { tone(180, 40, 0.35, 'sawtooth', 0.3); tone(90, 30, 0.4, 'square', 0.2); }   // only when there's no music to switch
      if (play) {
        const { gm, gh } = play, hold = 1.2, back = 7;
        try {
          gm.gain.cancelScheduledValues(n); gm.gain.setValueAtTime(0, n); gm.gain.setValueAtTime(0, n + hold); gm.gain.linearRampToValueAtTime(1, n + back);
          gh.gain.cancelScheduledValues(n); gh.gain.setValueAtTime(HIT_VOL, n); gh.gain.setValueAtTime(HIT_VOL, n + hold); gh.gain.linearRampToValueAtTime(0, n + back);
        } catch (e) {}
      }
    },
    splash() { tone(600, 60, 0.6, 'sine', 0.3); tone(1200, 200, 0.5, 'triangle', 0.12); },
    // fallback synth beat, used only when the music files can't be loaded (e.g. opened straight from disk)
    beat(dt, sp) {
      if (!noTracks) return false;
      let kick = false;
      acc += dt * (2.4 + sp * 1.5);
      while (acc >= 1) {
        acc -= 1;
        if (step % 2 === 0) { tone(130, 38, 0.13, 'sine', 0.45); kick = true; } else tone(7000, 5000, 0.03, 'square', 0.025);
        tone(bass[(step >> 1) % bass.length] * 2, bass[(step >> 1) % bass.length] * 2, 0.11, 'sawtooth', 0.06);
        step++;
      }
      return kick;
    },
  };
})();

// ---------- input ----------
function canStart() { return state === 'menu' || (state === 'over' && overT > 0.6); }
function inRect(e, r) { return r && e.clientX >= r.x && e.clientX <= r.x + r.w && e.clientY >= r.y && e.clientY <= r.y + r.h; }

window.addEventListener('pointerdown', e => {
  e.preventDefault(); sfx.init();
  if (state === 'loading') return;
  if (inRect(e, { x: 0, y: 16 * p, w: 15 * p, h: 15 * p })) { sfx.toggle(); return; }
  if (inRect(e, { x: 15 * p, y: 16 * p, w: 14 * p, h: 15 * p })) { sfx.skip(); return; }
  if (state !== 'play' && state !== 'dying' && inRect(e, ctrlRect)) {
    ctrl = ctrl === 'tb' ? 'lr' : 'tb';
    try { localStorage.setItem('neonhelix.ctrl', ctrl); } catch (err) {}
    return;
  }
  if (canStart()) { start(); return; }
  if (state !== 'play') return;
  const jump = ctrl === 'tb' ? e.clientY < window.innerHeight / 2 : e.clientX >= window.innerWidth / 2;
  if (jump) jumpBuf = 0.14; else duckBuf = 0.16;
}, { passive: false });
window.addEventListener('pointerup', () => sfx.wake());
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

window.addEventListener('keydown', e => {
  if (e.code === 'KeyM' || e.code === 'KeyN') { if (!e.repeat) { sfx.init(); e.code === 'KeyM' ? sfx.toggle() : sfx.skip(); } return; }
  const jumpKey = ['Space', 'ArrowUp', 'KeyW', 'ArrowRight', 'KeyD'].includes(e.code), duckKey = ['ArrowDown', 'KeyS', 'ArrowLeft', 'KeyA'].includes(e.code);
  if (!jumpKey && !duckKey && e.code !== 'Enter') return;
  e.preventDefault(); if (e.repeat) return; sfx.init();
  if (canStart()) { if (!duckKey) start(); return; }
  if (state !== 'play') return;
  if (jumpKey) jumpBuf = 0.14; else if (duckKey) duckBuf = 0.16;
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) sfx.wake(); });
window.addEventListener('focus', () => sfx.wake());
sfx.init();     // start decoding the first track behind the loading screen

setTimeout(() => { loadDone = true; }, 15000);     // never wait forever

// ---------- loop ----------
let last = 0;
function frame(now) {
  const dt = Math.min(0.034, (now - last) / 1000 || 0); last = now;
  update(dt); draw(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
